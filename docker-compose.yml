services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: capstone
      POSTGRES_PASSWORD: capstone
      POSTGRES_DB: metering_billing
    ports:
      - "5433:5432"        # host:container — 5433 outside, still 5432 inside the container
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: